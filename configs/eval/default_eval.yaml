# Evaluation configuration placeholder (M2 will define full schema)

dataset:
  path: data/eval/datasets/starter_dataset.yaml
  version: v0

retrieval:
  k_values: [1, 3, 5, 10]
  metrics: [recall_at_k, precision_at_k, hit_rate_at_k, mrr, ndcg_at_k]

answer:
  metrics: [citation_validity, faithfulness, refusal_correctness]

reporting:
  output_dir: data/eval/runs
  formats: [json, csv, md]

integrity:
  record_retrieval_latency: true
  record_end_to_end_latency: true
  record_model_token_usage_if_available: true
  record_indexing_cost_separately: true
  never_fabricate_results: true
